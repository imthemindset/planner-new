async function pdfTextOf(pdf,maxPages){
  let out='';
  for(let p=1;p<=Math.min(pdf.numPages,maxPages);p++){
    const page=await pdf.getPage(p),tc=await page.getTextContent(),rows=new Map();
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/3);let r=rows.get(y);if(!r){r=[];rows.set(y,r);}r.push({x:it.transform[4],s:it.str});});
    [...rows.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,r])=>{out+=r.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')+'\n';});
    out+='\n';
  }
  return out;
}
async function pdfRender(pdf,pageNo,maxSide){
  const page=await pdf.getPage(pageNo),v0=page.getViewport({scale:1}),k=maxSide/Math.max(v0.width,v0.height),vp=page.getViewport({scale:k});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:x,viewport:vp}).promise;return c;
}
async function processPdf(file,password){
  const show=h=>{const e=elx('ph-status');if(e)e.innerHTML=h;};
  const step=(t,p)=>show(`<div class="small"><b>${esc(t)}</b></div><div class="bar" style="margin-top:8px"><i style="width:${p!=null?Math.round(p*100):35}%"></i></div>`);
  const run=++VT.run,alive=()=>run===VT.run&&!!elx('ph-status');
  step('Abrindo o PDF…');
  let lib,pdf;
  try{lib=await ensurePdf();}catch(e){console.warn(e);show('<div class="notice" role="alert">Não consegui carregar o leitor de PDF (sem internet?). Tente de novo ou fotografe a conta.</div>');return;}
  try{pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),password}).promise;}
  catch(e){
    if(e&&e.name==='PasswordException'){
      pendingPdf=file;
      show(`<div class="notice"><b>${password?'Senha incorreta.':'Este PDF tem senha.'}</b><br>Muitas contas usam os primeiros dígitos do CPF.</div><div class="field" style="margin-top:8px"><input id="pdf-pass" class="input" type="password" placeholder="Senha do PDF" autocomplete="off" aria-label="Senha do PDF"></div><button class="btn primary block" data-action="pdf-pass">Abrir PDF</button>`);
      return;
    }
    console.warn(e);show('<div class="notice" role="alert">Não consegui abrir este PDF. Ele pode estar corrompido. Tente fotografar a conta.</div>');return;
  }
  if(!alive())return;
  step('Lendo o texto do PDF…');
  let text='';try{text=await pdfTextOf(pdf,3);}catch(e){console.warn(e);}
  let big=null;try{big=await pdfRender(pdf,1,1600);}catch(e){console.warn(e);}
  if(!alive())return;
  let result=null,reason=null;
  if(text.replace(/\s/g,'').length<40){ // PDF escaneado: sem texto, usa OCR na primeira página
    if(!big){show('<div class="notice">Não consegui ler este PDF. Tente fotografar a conta.</div>');return;}
    const r=await readReceipt({canvas:big},(t,p)=>{if(alive())step(t,p);});result=r.result;reason=r.reason;
  }else{
    result=parseReceipt(text);reason=result.amount?null:'noamount';
    if(!result.amount&&aiAvailable()&&big){const r=await readReceipt({canvas:big},()=>{});if(r.result&&r.result.amount){result=r.result;reason=null;}}
  }
  if(!alive())return;
  const d=mkDraft(result,big?downscale(big,1000,.62):'',reason);
  if(S().media.autoSave&&result&&result.amount&&result.kind!=='bill'){await savePhotoDraft(d,true);return;}
  openPhotoConfirm(d);
}

const LA={
  get:()=>store.get('pf_local_auth',null),
  async hash(pass,saltHex){
    const salt=new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16)));
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  },
  async create(email,pass){
    const sh=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
    store.set('pf_local_auth',{email,salt:sh,hash:await this.hash(pass,sh)});
  },
  async check(pass){const a=this.get();return !!a&&(await this.hash(pass,a.salt))===a.hash;}
};

normalizeRead=function(o,src){
  if(!o||typeof o!=='object')return null;
  const bill=o.kind==='bill';
  let amount=typeof o.amount==='string'?parseMoney(o.amount):Number(o.amount);
  if(!(amount>0)||amount>1e7)amount=null;
  let date=/^\d{4}-\d{2}-\d{2}$/.test(String(o.date||''))?o.date:null;
  if(date&&(date<addYears(todayStr(),-3)||date>addDays(todayStr(),bill?500:1)))date=null;
  const type=o.type==='income'?'income':'expense',service=['luz','agua','gas','internet','celular'].includes(o.service)?o.service:null;
  const pref=activeCats('expense').find(c=>/^(contas?( fixas?)?|utilidades|servicos)$/.test(norm(c)));
  let category=activeCats(type).includes(o.category)?o.category:null;
  if(bill&&service)category=pref||(activeCats('expense').includes('Moradia')?'Moradia':category);
  const notes=[];if(o.reference)notes.push('Referência '+String(o.reference).slice(0,20));if(o.barcode)notes.push('Linha digitável: '+String(o.barcode).slice(0,60));
  return {amount,date,merchant:o.merchant?String(o.merchant).trim().slice(0,60):'',payment:PAYS.includes(o.payment)?o.payment:(bill&&o.barcode?'Boleto':''),type,category,src,kind:bill?'bill':'receipt',status:bill?'pending':'',tags:service?[service]:[],note:notes.join('\n')};
};
aiRead=async function(dataUrl){
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),25000);
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:dataUrl.split(',')[1]}},
      {type:'text',text:`Leia este documento brasileiro (nota ou cupom fiscal, comprovante de Pix, conta de água, luz, internet, celular ou gás, ou boleto) e responda SOMENTE com JSON, sem markdown: {"kind":"receipt" ou "bill","amount":número ou null,"date":"AAAA-MM-DD" (em conta ou boleto use o VENCIMENTO; em comprovante use a data da compra) ou null,"merchant":"estabelecimento, favorecido ou empresa" ou null,"service":"luz|agua|gas|internet|celular|outro" ou null,"payment":"Pix|Débito|Crédito|Dinheiro|Boleto|Transferência" ou null,"type":"expense ou income","category":"uma de: ${activeCats('expense').join(', ')}" ou null,"barcode":"linha digitável se houver" ou null,"reference":"mês de referência se houver" ou null}. Hoje é ${todayStr()}.`}]}]})});
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json(),txt=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    return normalizeRead(JSON.parse(txt.replace(/```json|```/g,'').trim()),'ia');
  }finally{clearTimeout(tm);}
};
async function runDocsTest(){
  const rows=[],add=(ok,t,m,h)=>rows.push(`<li><span class="st">${ok?'✅':'❌'}</span><span><b>${esc(t)}</b><small>${esc(m)}</small>${h?`<small>👉 ${esc(h)}</small>`:''}</span></li>`);
  const dueD=addDays(todayStr(),9),dueBR=dueD.split('-').reverse().join('/'),todayBR=todayStr().split('-').reverse().join('/');
  const luz=parseReceipt(`CEMIG DISTRIBUICAO S.A.\nCONTA DE ENERGIA ELETRICA\nCONSUMO 210 kWh\nVENCIMENTO ${dueBR}\nTOTAL A PAGAR R$ 187,43`),p1=[];
  if(luz.kind!=='bill')p1.push('tipo conta');if(Math.abs((luz.amount||0)-187.43)>.01)p1.push('valor');if(luz.date!==dueD)p1.push('vencimento');if(!/cemig/i.test(luz.merchant))p1.push('empresa');if(luz.status!=='pending')p1.push('situação');
  add(!p1.length,'Conta de luz (exemplo)',p1.length?'Não identifiquei: '+p1.join(', '):`Valor ${nf.format(luz.amount)}, vencimento ${fmtDate(luz.date)}, ${luz.merchant}, pendente.`);
  const fator=1000+diffDays('2025-02-22',dueD),L=('23791'+'23456'+'78901'+'234567'+'89012'+'345678'+'9'+String(fator).padStart(4,'0')+'0000012990');
  const bol=parseReceipt(`CONTA DE INTERNET\nBRISANET\nLINHA DIGITAVEL\n${L.slice(0,5)}.${L.slice(5,10)} ${L.slice(10,15)}.${L.slice(15,21)} ${L.slice(21,26)}.${L.slice(26,32)} ${L[32]} ${L.slice(33)}`),p2=[];
  if(bol.kind!=='bill')p2.push('tipo conta');if(Math.abs((bol.amount||0)-129.9)>.01)p2.push('valor da linha digitável');if(bol.date!==dueD)p2.push('vencimento da linha digitável');if(bol.payment!=='Boleto')p2.push('pagamento');if(!/Linha digit/.test(bol.note||''))p2.push('observação');
  add(!p2.length,'Boleto com linha digitável (exemplo)',p2.length?'Não identifiquei: '+p2.join(', '):`Valor ${nf.format(bol.amount)} e vencimento ${fmtDate(bol.date)} lidos da própria linha digitável.`);
  const nfc=parseReceipt(`SUPERMERCADO BOM PRECO LTDA\nCNPJ 12.345.678/0001-90\nNFC-e NOTA FISCAL DE CONSUMIDOR ELETRONICA\nEmissao: ${todayBR} 14:32\nQTD TOTAL DE ITENS 6\nVALOR TOTAL R$ 88,40\nFORMA DE PAGAMENTO\nCartao de Debito 88,40`),p3=[];
  if(nfc.kind!=='receipt')p3.push('tipo');if(Math.abs((nfc.amount||0)-88.4)>.01)p3.push('valor');if(nfc.payment!=='Débito')p3.push('pagamento');if(!/CNPJ/.test(nfc.note||''))p3.push('CNPJ');if(!nfc.tags.includes('nota-fiscal'))p3.push('tag nota-fiscal');
  add(!p3.length,'Nota fiscal (exemplo)',p3.length?'Não identifiquei: '+p3.join(', '):`Valor ${nf.format(nfc.amount)}, ${nfc.merchant}, pagamento ${nfc.payment}, ${nfc.note}.`);
  try{await ensurePdf();add(true,'Leitor de PDF','pdf.js carregado. PDFs com texto são lidos direto; escaneados passam pelo OCR; protegidos por senha pedem a senha.');}
  catch(e){add(false,'Leitor de PDF','Não consegui carregar o pdf.js.','Conecte-se à internet e repita o teste.');}
  const el=elx('vt-list');if(!el)return;
  el.insertAdjacentHTML('afterend',`<h3 style="margin:18px 0 10px;font-size:16px">Contas, boletos e PDF</h3><ul class="steps">${rows.join('')}</ul>`);
}
const _runPhotoTestD=runPhotoTest;
runPhotoTest=async function(){await _runPhotoTestD();try{await runDocsTest();}catch(e){console.error(e);}};
boot();

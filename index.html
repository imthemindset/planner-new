<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>Planejador Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ===== 1. TOKENS (claro / escuro) ===== */
:root{
  --bg:#f3f5fb;
  --bg-grad:radial-gradient(1200px 600px at 10% -10%,#e0e7ff 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#fae8ff 0%,transparent 55%);
  --card:rgba(255,255,255,.82);--solid:#ffffff;--text:#0f172a;--muted:#64748b;--line:rgba(15,23,42,.09);
  --brand:#6366f1;--brand2:#8b5cf6;--income:#10b981;--expense:#f43f5e;--invest:#6366f1;--warn:#f59e0b;
  --r:20px;--shadow:0 12px 32px -16px rgba(30,41,90,.35);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
[data-theme=dark]{
  --bg:#0a0f1f;
  --bg-grad:radial-gradient(1000px 500px at 10% -10%,#1e1b4b 0%,transparent 60%),radial-gradient(800px 400px at 100% 0%,#2e1065 0%,transparent 55%);
  --card:rgba(23,29,56,.72);--solid:#161c36;--text:#e7ebf8;--muted:#93a0c2;--line:rgba(255,255,255,.09);
  --shadow:0 12px 32px -16px rgba(0,0,0,.7);
}
/* ===== 2. BASE ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{letter-spacing:-.02em}
h3{margin:0 0 12px;font-size:17px}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}.grow{flex:1}
:focus-visible{outline:3px solid rgba(99,102,241,.6);outline-offset:2px;border-radius:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== 3. LAYOUT ===== */
.app{min-height:100vh}
.side{display:none}
.main{padding:16px 16px calc(130px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
@media(min-width:900px){
  .app{display:grid;grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;padding:24px 14px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .main{padding:28px 32px 120px;width:100%}
  .bottom{display:none!important}
}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;margin:0 8px 18px}
.logo{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--brand),var(--brand2));margin:0 auto 12px}
.logo.sm{width:38px;height:38px;font-size:20px;border-radius:12px;margin:0}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;font-size:11px;font-weight:700;color:var(--muted);border-radius:14px}
.nav-btn svg{width:22px;height:22px}
.nav-btn.active{color:var(--brand)}
.side .nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:0 14px}
.side .nav-btn.active{background:rgba(99,102,241,.12)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.fab-wrap{position:fixed;z-index:40;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%)}
@media(min-width:900px){.fab-wrap{left:auto;right:32px;bottom:32px;transform:none}}
.fab{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -8px rgba(99,102,241,.75)}
.fab svg{width:28px;height:28px;transition:transform .25s}
.fab-wrap.open .fab svg{transform:rotate(45deg)}
.fab-menu{position:absolute;bottom:76px;left:50%;transform:translateX(-50%) translateY(10px);display:flex;flex-direction:column-reverse;gap:10px;min-width:200px;opacity:0;pointer-events:none;transition:.2s}
@media(min-width:900px){.fab-menu{left:auto;right:0;transform:translateY(10px)}}
.fab-wrap.open .fab-menu{opacity:1;pointer-events:auto;transform:translateX(-50%)}
@media(min-width:900px){.fab-wrap.open .fab-menu{transform:none}}
.fab-item{display:flex;align-items:center;gap:12px;padding:0 18px;min-height:50px;border-radius:16px;background:var(--solid);box-shadow:var(--shadow);font-weight:700;border:1px solid var(--line);text-align:left}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,15,31,.4);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
/* ===== 4. COMPONENTES ===== */
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px;margin-top:14px}
.g2{grid-template-columns:1fr}
@media(min-width:800px){.g2{grid-template-columns:1fr 1fr}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:700}
.stat .val{font-size:20px;font-weight:800;margin:4px 0;white-space:nowrap}
.val.income,.income{color:var(--income)}.val.expense,.expense{color:var(--expense)}.val.investment,.investment{color:var(--invest)}
.delta{font-size:12px;font-weight:700;color:var(--muted)}.delta.ok{color:var(--income)}.delta.bad{color:var(--expense)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.hello h1{margin:0;font-size:24px}
.hello p{margin:2px 0 0;color:var(--muted);font-size:13px}
.toprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.icon-btn svg{width:20px;height:20px}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px}
.monthnav .icon-btn{border:0;background:none}
.monthnav b{min-width:120px;text-align:center;font-size:14px;cursor:pointer}
.notice{background:rgba(245,158,11,.14);color:#b45309;border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:12px;font-weight:600}
[data-theme=dark] .notice{color:#fbbf24}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#c026d3);color:#fff;border-radius:26px;padding:22px;position:relative;overflow:hidden;box-shadow:0 22px 40px -20px rgba(79,70,229,.8)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .cap{font-size:13px;font-weight:700;opacity:.85}
.hero .big{font-size:clamp(32px,9vw,46px);font-weight:800;letter-spacing:-.03em;margin:2px 0 6px}
.hero .daily{font-size:14px;opacity:.95;position:relative;z-index:1}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.btn{min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 10px 20px -10px rgba(99,102,241,.8)}
.btn.ghost{background:var(--solid);border:1px solid var(--line)}
.btn.danger{background:rgba(244,63,94,.12);color:var(--expense)}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.input,.select,.textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--solid);outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.input[readonly]{opacity:.7}
.big-in{font-size:26px;font-weight:800;min-height:58px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:42px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.seg button.on.expense{background:var(--expense)}.seg button.on.income{background:var(--income)}.seg button.on.investment{background:var(--invest)}
.seg button.on.paid{background:var(--income)}.seg button.on.pending{background:var(--warn)}
.err{color:var(--expense);font-size:13px;min-height:18px;margin:0 0 8px;font-weight:600}
.msg{font-size:13px;min-height:18px;margin:0 0 10px;font-weight:600;color:var(--expense)}.msg.info{color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--solid);font-weight:700;font-size:13px;color:var(--muted)}
.chip.on{background:var(--brand);color:#fff;border-color:transparent}
.searchbar{display:flex;gap:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fgrid .btn{grid-column:1/-1}
.sumline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;padding:14px 4px 0;color:var(--muted)}
.day{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;min-height:64px;cursor:pointer;transition:transform .15s}
.row:hover{transform:translateY(-1px)}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.amt{font-weight:800;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(245,158,11,.16);color:#d97706;margin-top:3px}
.badge.late{background:rgba(244,63,94,.14);color:var(--expense)}
.check{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--line);font-weight:800;color:var(--income);flex:none}
.chart{position:relative;height:230px}
.legs{margin-top:10px}
.leg{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ins{display:flex;gap:12px;padding:12px;border-radius:14px;background:rgba(99,102,241,.09);margin-bottom:8px;font-size:14px;line-height:1.4}
.ins.warn{background:rgba(245,158,11,.13)}.ins.bad{background:rgba(244,63,94,.11)}.ins.ok{background:rgba(16,185,129,.11)}
.score{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.parts p{margin:4px 0 0}
.prow{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.bar{height:10px;border-radius:99px;background:rgba(148,163,184,.25);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.row-between{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pct{font-size:22px;color:var(--brand)}
.goal .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.empty{text-align:center;padding:34px 16px}
.empty p{max-width:380px;margin:6px auto 16px}
.mini-empty{text-align:center;padding:26px 8px;color:var(--muted);font-size:14px}
.mini-empty b{display:block;color:var(--text);margin-bottom:4px}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid rgba(99,102,241,.2);border-top-color:var(--brand);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{border-radius:20px;background:linear-gradient(90deg,rgba(148,163,184,.15),rgba(148,163,184,.3),rgba(148,163,184,.15));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#c026d3)}
.login-card{width:100%;max-width:400px;background:var(--solid);border-radius:28px;padding:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.login-card h1{text-align:center;margin:0;font-size:24px}
.login-card>p{text-align:center;margin:4px 0 20px}
.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(10,15,31,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--solid);border-radius:26px 26px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s}
.sheet-back.on .sheet{transform:none}
@media(min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:26px}}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(148,163,184,.45);margin:0 auto 14px}
.sheet h3{font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;background:#111827;color:#fff;padding:12px 16px;border-radius:14px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#a5b4fc;font-weight:800;min-height:32px;padding:0 4px}
/* ===== 5. AJUSTES (cards, subtelas, formulários) ===== */
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.page-head h1{margin:0;font-size:22px}
.scard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left;min-height:68px;transition:transform .15s}
.scard:hover{transform:translateY(-1px)}
.scard .tt{font-weight:700}.scard .dd{font-size:12px;color:var(--muted)}
.scard svg{width:20px;height:20px;color:var(--muted);flex:none}
.stile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(99,102,241,.12);flex:none}
.profile-card{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:18px;border-radius:24px;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#c026d3);color:#fff;width:100%;text-align:left;box-shadow:0 22px 40px -22px rgba(79,70,229,.8)}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:800;font-size:24px;background:rgba(255,255,255,.22);color:#fff}
.avatar.lg{width:96px;height:96px;font-size:36px;background:linear-gradient(135deg,var(--brand),var(--brand2));margin:0 auto}
.trow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px;cursor:pointer}
.trow:last-of-type{border-bottom:0}
.trow small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:500}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:rgba(148,163,184,.45);position:relative;flex:none;cursor:pointer;transition:background .2s;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sw:checked{background:var(--brand)}
.sw:checked::after{transform:translateX(22px)}
.cropbox{display:grid;place-items:center}
.cropbox canvas{width:260px;height:260px;border-radius:50%;touch-action:none;background:rgba(148,163,184,.3);cursor:grab}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--text)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{min-height:42px;font-size:20px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.emojis button.on{border-color:var(--brand);background:rgba(99,102,241,.14)}
.crow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:0}
.crow .nm{flex:1;min-width:0;font-weight:700}
.mb{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);flex:none;font-weight:800}
.mb:disabled{opacity:.35}
.mb-row{display:flex;gap:6px}
.tagchip{display:inline-flex;gap:6px;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;background:rgba(99,102,241,.12);font-weight:700;font-size:13px;margin:0 8px 8px 0}
details.faq{border-bottom:1px solid var(--line);padding:12px 0}
details.faq summary{font-weight:700;cursor:pointer;min-height:32px}
details.faq p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
pre.code{background:rgba(148,163,184,.15);border-radius:12px;padding:12px;font-size:12px;overflow:auto;white-space:pre-wrap}
.bar.warn>i{background:linear-gradient(90deg,#f59e0b,#f97316)}
.bar.bad>i{background:linear-gradient(90deg,#f43f5e,#e11d48)}
.cardx{margin-top:14px}
</style>
</head>
<body>
<div id="splash" class="splash"><div class="spin" aria-label="Carregando"></div></div>
<main id="login" class="login hidden">
  <div class="login-card">
    <div class="logo">💰</div>
    <h1>Planejador Financeiro</h1>
    <p class="muted">Seu centro de comando financeiro</p>
    <form id="login-form" novalidate>
      <div class="field"><label for="login-email">E-mail</label><input id="login-email" class="input" type="email" autocomplete="email" placeholder="voce@email.com"></div>
      <div class="field"><label for="login-pass">Senha</label><input id="login-pass" class="input" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <p id="login-msg" class="msg" role="alert"></p>
      <button class="btn primary block" type="submit">Entrar</button>
    </form>
    <p class="muted small center" style="margin:16px 0 0">🔒 Acesso exclusivo</p>
  </div>
</main>
<div id="app" class="app hidden">
  <aside class="side" id="side"></aside>
  <main class="main"><div id="view"></div></main>
  <nav class="bottom" id="bottom" aria-label="Navegação principal"></nav>
  <div id="scrim" class="scrim" data-action="fab-close"></div>
  <div id="fab-wrap" class="fab-wrap">
    <div class="fab-menu" role="menu">
      <button class="fab-item" role="menuitem" data-action="fab-manual"><span aria-hidden="true">✍️</span> Manual</button>
      <button class="fab-item" role="menuitem" data-action="fab-photo"><span aria-hidden="true">📷</span> Foto</button>
      <button class="fab-item" role="menuitem" data-action="fab-voice"><span aria-hidden="true">🎙️</span> Voz</button>

    category:t.category||'Outros',description:t.description||''};
}
async function exec(op){
  const d=(n,id)=>F.doc(fb.db,n,id);
  const batches=async(ids,fn)=>{for(let i=0;i<ids.length;i+=400){const b=F.writeBatch(fb.db);ids.slice(i,i+400).forEach(x=>fn(b,x));await b.commit();}};
  if(op.t==='add')await batches(op.items,(b,x)=>b.set(d('transactions',x.id),x.data));
  else if(op.t==='upd')await F.updateDoc(d('transactions',op.id),op.patch);
  else if(op.t==='updMany')await batches(op.ids,(b,id)=>b.update(d('transactions',id),op.patch));
  else if(op.t==='del')await batches(op.ids,(b,id)=>b.delete(d('transactions',id)));
  else if(op.t==='gadd')await F.setDoc(d('goals',op.id),op.data);
  else if(op.t==='gupd')await F.updateDoc(d('goals',op.id),op.patch);
  else if(op.t==='gdel')await F.deleteDoc(d('goals',op.id));
  else if(op.t==='settings')await F.setDoc(d('userSettings',state.user.uid),op.data);
}
// Fila local: se estiver sem internet (ou o servidor demorar), a operação fica guardada e é reenviada depois.
const Q={
  key:()=>`pf_q_${state.user?.uid||'x'}`,
  get(){return store.get(this.key(),[]);},
  set(a){store.set(this.key(),a);state.pending=a.length;},
  push(op){let a=this.get();if(op.t==='settings')a=a.filter(x=>x.t!=='settings');a.push(op);this.set(a);},
  busy:false,
  async flush(){
    if(state.mode!=='firebase'||!navigator.onLine||Q.busy||!state.user)return;
    Q.busy=true;let sent=0;
    try{
      let a=Q.get();
      while(a.length){
        try{await withTimeout(exec(a[0]),15000);a.shift();Q.set(a);sent++;}
        catch(e){
          if(isNet(e))break;
          console.error('Operação descartada',e);a.shift();Q.set(a);
          toast('Uma alteração não pôde ser sincronizada (permissão ou item removido).');
        }
      }
    }finally{Q.busy=false;if(sent&&!Q.get().length)toast('Alterações sincronizadas ✓');if(!state.loading)render();}
  }
};
async function run(op){
  if(state.mode!=='firebase')return;
  if(!navigator.onLine||Q.get().length){Q.push(op);if(navigator.onLine)Q.flush();return 'queued';}
  try{await withTimeout(exec(op),9000);}
  catch(e){if(isNet(e)){Q.push(op);return 'queued';}throw e;}
}

/* =====================================================================
   5. CÁLCULOS: totais, categorização automática, score e insights
   ===================================================================== */
const monthTx=m=>state.tx.filter(t=>monthOf(t.date)===m);
function sums(list){
  const s={income:0,expense:0,investment:0,pendingOut:0};
  list.forEach(t=>{s[t.type]+=t.amount;if(t.status==='pending'&&t.type!=='income')s.pendingOut+=t.amount;});
  return s;
}
function catTotals(list,type){const o={};list.filter(t=>t.type===type).forEach(t=>{o[t.category]=(o[t.category]||0)+t.amount;});return o;}
const delta=(cur,prev)=>prev>0?(cur-prev)/prev*100:null;
function ruleKey(desc){return norm(desc).replace(/\b\d+\b/g,'').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ');}
function suggestCategory(desc,type){
  const key=ruleKey(desc);if(!key)return null;
  const n=' '+norm(desc)+' ',R=S().rules[type]||{};
  if(R[key])return R[key];
  for(const k of Object.keys(R))if(k.length>=3&&n.includes(' '+k+' '))return R[k];
  for(const [cat,words] of Object.entries(DEFAULT_KW[type]||{}))if(words.some(w=>n.includes(' '+w+' ')))return cat;
  return null;
}
function learnRule(desc,cat,type){
  const key=ruleKey(desc);if(!key||key.length<3)return;
  S().rules[type]=S().rules[type]||{};S().rules[type][key]=cat;saveSettings(false);
}
function healthScore(m){
  const s=sums(monthTx(m)),p=sums(monthTx(prevMonth(m))),today=todayStr(),parts=[];
  const rate=s.income>0?(s.income-s.expense)/s.income:null;
  parts.push({name:'Taxa de poupança',max:40,pts:rate==null?0:Math.round(clamp(rate/0.2,0,1)*40),
    tip:rate==null?'Registre suas receitas do mês para medir quanto sobra.':rate>=0.2?'Você poupa 20% ou mais da renda. Continue assim!':`Hoje você poupa ${Math.max(0,Math.round(rate*100))}% da renda. A meta saudável é 20%.`});
  let p2=10,t2='Ainda não há mês anterior para comparar.';
  if(p.expense>0&&s.expense>0){const ratio=s.expense/p.expense;p2=Math.round(clamp((1.3-ratio)/0.3,0,1)*20);t2=ratio<=1?'Suas despesas estão iguais ou menores que no mês passado.':`Suas despesas estão ${Math.round((ratio-1)*100)}% acima do mês passado. Revise os maiores gastos.`;}
  parts.push({name:'Despesas vs. mês anterior',max:20,pts:p2,tip:t2});
  const late=state.tx.filter(t=>t.status==='pending'&&t.type!=='income'&&t.date<today);
  parts.push({name:'Contas em dia',max:20,pts:Math.max(0,20-5*late.length),tip:late.length?`${late.length} conta(s) atrasada(s). Pague ou ajuste a data para recuperar pontos.`:'Nenhuma conta atrasada. Ótimo!'});
  const gp=state.goals.length?state.goals.reduce((a,g)=>a+(g.target>0?Math.min(1,g.current/g.target):0),0)/state.goals.length:0;
  parts.push({name:'Metas',max:10,pts:state.goals.length?Math.round(4+gp*6):0,tip:state.goals.length?'Cada aporte nas metas aumenta sua pontuação.':'Crie uma meta (ex.: reserva de emergência) para ganhar pontos.'});
  const days=new Set(state.tx.filter(t=>t.date>=addDays(today,-13)&&t.date<=today).map(t=>t.date)).size;
  parts.push({name:'Constância',max:10,pts:Math.round(clamp(days/7,0,1)*10),tip:days>=7?'Você lança com regularidade. Isso dá clareza!':'Lance seus gastos com frequência: 7 dias com registros nas últimas 2 semanas dão nota máxima.'});
  const score=parts.reduce((a,x)=>a+x.pts,0);
  const label=score>=80?'Excelente':score>=60?'Bom':score>=40?'Atenção':'Crítico';
  const desc=score>=80?'Suas finanças estão muito bem organizadas.':score>=60?'Você está no caminho certo. Veja onde dá para melhorar.':score>=40?'Há pontos importantes para ajustar.':'Vamos agir: comece pelos itens com menos pontos.';
  return {score,label,desc,parts};
}
function insights(m,s,ps){
  const out=[],today=todayStr(),list=monthTx(m);
  const cm=catTotals(list,'expense'),pm=catTotals(monthTx(prevMonth(m)),'expense');
  const ch=Object.keys(cm).filter(c=>pm[c]>0).map(c=>({c,d:(cm[c]-pm[c])/pm[c]*100,diff:cm[c]-pm[c]}));
  const up=ch.filter(x=>x.d>=15&&x.diff>=30).sort((a,b)=>b.diff-a.diff)[0];
  const down=ch.filter(x=>x.d<=-15&&-x.diff>=30).sort((a,b)=>a.diff-b.diff)[0];
  if(up)out.push({tone:'warn',i:'📈',t:`Você gastou <b>${Math.round(up.d)}% a mais</b> em ${esc(up.c)} que no mês passado (${brl(up.diff)} a mais).`});
  if(down)out.push({tone:'ok',i:'👏',t:`Boa! Em ${esc(down.c)} você gastou <b>${Math.round(-down.d)}% menos</b> que no mês passado.`});
  const late=state.tx.filter(t=>t.status==='pending'&&t.type==='expense'&&t.date<today);
  if(late.length)out.push({tone:'bad',i:'⏰',t:`<b>${late.length} lançamento(s) atrasado(s)</b> somando ${brl(late.reduce((a,t)=>a+t.amount,0))}.`});
  const soon=state.tx.filter(t=>t.status==='pending'&&t.type==='expense'&&t.date>=today&&t.date<=addDays(today,7));
  if(soon.length)out.push({tone:'warn',i:'🗓️',t:`<b>${soon.length} conta(s)</b> vence(m) nos próximos 7 dias: ${brl(soon.reduce((a,t)=>a+t.amount,0))}.`});
  const big=list.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount)[0];
  if(big)out.push({tone:'info',i:'💸',t:`Maior gasto do mês: <b>${esc(big.description)}</b> (${brl(big.amount)}).`});
  if(s.income>0&&(s.income-s.expense)/s.income>=0.2)out.push({tone:'ok',i:'🎯',t:`Você está poupando <b>${Math.round((s.income-s.expense)/s.income*100)}%</b> da renda, acima da meta de 20%.`});
  return out.slice(0,5);
}

      <button class="btn ghost" data-action="clear-filters">Limpar filtros</button>
    </div>
  </div>
  <div id="tx-summary"></div><div id="tx-list"></div>`;
}
function filteredTx(){
  const f=state.filters,q=norm(f.q),min=parseMoney(f.min),max=parseMoney(f.max),y=state.month.slice(0,4),tag=norm(f.tag.replace(/^#/,''));
  const arr=state.tx.filter(t=>{
    if(f.period==='month'&&monthOf(t.date)!==state.month)return false;
    if(f.period==='year'&&t.date.slice(0,4)!==y)return false;
    if(f.period==='custom'){if(f.from&&t.date<f.from)return false;if(f.to&&t.date>f.to)return false;}
    if(f.type&&t.type!==f.type)return false;
    if(f.cat&&t.category!==f.cat)return false;
    if(f.status&&t.status!==f.status)return false;
    if(tag&&!t.tags.some(x=>norm(x)===tag))return false;
    if(!isNaN(min)&&t.amount<min)return false;
    if(!isNaN(max)&&t.amount>max)return false;
    if(q&&!norm([t.description,t.category,t.payment,t.note,accName(t.accountId),...t.tags].join(' ')).includes(q))return false;
    return true;
  });
  const cmp={date_desc:(a,b)=>b.date.localeCompare(a.date),date_asc:(a,b)=>a.date.localeCompare(b.date),amt_desc:(a,b)=>b.amount-a.amount,amt_asc:(a,b)=>a.amount-b.amount}[f.sort]||((a,b)=>b.date.localeCompare(a.date));
  return arr.sort(cmp);
}
function renderTxList(){
  const sumEl=$('#tx-summary'),listEl=$('#tx-list');if(!sumEl||!listEl)return;
  if(!state.tx.length){sumEl.innerHTML='';listEl.innerHTML=bigEmpty();return;}
  const list=filteredTx(),s=sums(list);
  if(!list.length){sumEl.innerHTML='';listEl.innerHTML=`<div class="card empty">${illus()}<h3>Nada encontrado</h3><p class="muted">Nenhum lançamento combina com esses filtros.</p><button class="btn ghost" data-action="clear-filters">Limpar filtros</button></div>`;return;}
  sumEl.innerHTML=`<div class="sumline"><span>${list.length} lançamento${list.length>1?'s':''}</span><span class="income">+ ${brl(s.income)}</span><span class="expense">− ${brl(s.expense)}</span>${s.investment?`<span class="investment">◆ ${brl(s.investment)}</span>`:''}</div>`;
  const grp=state.filters.sort.startsWith('date');let html='',last='';
  list.slice(0,state.txLimit).forEach(t=>{if(grp&&t.date!==last){html+=`<div class="day">${dayLabel(t.date)}</div>`;last=t.date;}html+=txRow(t,!grp);});
  if(list.length>state.txLimit)html+=`<button class="btn ghost block" data-action="more">Mostrar mais (${list.length-state.txLimit})</button>`;
  listEl.innerHTML=html;
}

async function saveTxForm(btn){
  const err=$('#ff-err'),amount=parseMoney($('#ff-amount').value),date=$('#ff-date').value;
  if(isNaN(amount)||amount<=0){err.textContent='Informe um valor maior que zero.';$('#ff-amount').focus();return;}

  }

function openCrop(file){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const SZ=260,min=Math.max(SZ/img.width,SZ/img.height);let scale=min,ox=(SZ-img.width*scale)/2,oy=(SZ-img.height*scale)/2;
    openSheet(`<h3>Ajustar foto</h3><p class="muted small">Arraste para enquadrar e use o controle para ampliar.</p><div class="cropbox"><canvas id="cv" width="${SZ}" height="${SZ}"></canvas></div><input id="zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom" style="width:100%;margin:16px 0"><button class="btn primary block" id="crop-ok">Usar esta foto</button>`);
    const cv=$('#cv'),ctx=cv.getContext('2d');
    const draw=()=>{ctx.clearRect(0,0,SZ,SZ);ctx.drawImage(img,ox,oy,img.width*scale,img.height*scale);};
    const fit=()=>{ox=Math.min(0,Math.max(SZ-img.width*scale,ox));oy=Math.min(0,Math.max(SZ-img.height*scale,oy));};
    let drag=null;draw();
    cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId);};
    cv.onpointermove=e=>{if(!drag)return;ox=drag.ox+(e.clientX-drag.x);oy=drag.oy+(e.clientY-drag.y);fit();draw();};
    cv.onpointerup=()=>{drag=null;};
    $('#zoom').oninput=e=>{const cx=(SZ/2-ox)/scale,cy=(SZ/2-oy)/scale;scale=min*e.target.value;ox=SZ/2-cx*scale;oy=SZ/2-cy*scale;fit();draw();};
    $('#crop-ok').onclick=()=>{const out=document.createElement('canvas');out.width=out.height=256;out.getContext('2d').drawImage(cv,0,0,SZ,SZ,0,0,256,256);S().profile.photo=out.toDataURL('image/jpeg',.85);closeSheet();saveSettings();render();};
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Não consegui abrir essa imagem. Tente um JPG ou PNG.');};
  img.src=url;
}

/* ---------- Conta e segurança ---------- */
async function reauth(pass){
  const u=fb.auth.currentUser;if(!u)throw Object.assign(new Error('sem sessão'),{code:'auth/requires-recent-login'});
  await A.reauthenticateWithCredential(u,A.EmailAuthProvider.credential(u.email,pass));return u;
}
function authErr(e){
  const c=e&&e.code;
  return ['auth/wrong-password','auth/invalid-credential'].includes(c)?'Senha atual incorreta.'
    :c==='auth/weak-password'?'A nova senha precisa ter pelo menos 6 caracteres.'
    :c==='auth/requires-recent-login'?'Por segurança, saia e entre de novo antes de fazer isso.'
    :c==='auth/too-many-requests'?'Muitas tentativas. Aguarde alguns minutos.'
    :c==='auth/network-request-failed'?'Sem conexão com a internet.':'Não foi possível concluir. Tente novamente.';
}
async function deleteAccount(pass){
  const u=await reauth(pass),uidv=u.uid;
  for(const col of ['transactions','goals']){
    const snap=await F.getDocs(F.query(F.collection(fb.db,col),F.where('userId','==',uidv))),ids=snap.docs.map(d=>d.id);
    for(let i=0;i<ids.length;i+=400){const b=F.writeBatch(fb.db);ids.slice(i,i+400).forEach(id=>b.delete(F.doc(fb.db,col,id)));await b.commit();}
  }
  try{await F.deleteDoc(F.doc(fb.db,'userSettings',uidv));}catch(e){console.warn(e);}
  await A.deleteUser(u);
  try{Object.keys(localStorage).filter(k=>k.includes(uidv)).forEach(k=>localStorage.removeItem(k));}catch{}
}
function pageSecurity(){
  if(state.mode!=='firebase')return `<div class="card"><p class="muted" style="margin-top:0">Você está no modo local (sem login), então não há senha nem sessões para gerenciar.</p><button class="btn danger block" data-action="local-wipe">Apagar dados deste aparelho</button></div>`;
  return `<div class="card"><h3>Senha</h3><button class="btn ghost block" data-action="pw-change">🔑 Alterar senha</button><button class="btn ghost block" style="margin-top:10px" data-action="pw-reset">✉️ Enviar e-mail de redefinição</button><p class="muted small">O e-mail de redefinição vai para ${esc(state.user.email)}.</p></div>
  <div class="card cardx"><h3>Sessões</h3><button class="btn ghost block" data-action="sign-out">Sair da conta neste aparelho</button><button class="btn ghost block" style="margin-top:10px" data-action="sign-out-all">Sair de todos os dispositivos</button><p class="muted small">Os outros aparelhos são desconectados na próxima vez que o app for aberto ou voltar ao primeiro plano.</p></div>
  <div class="card cardx"><h3 style="color:var(--expense)">Zona de risco</h3><p class="muted small" style="margin-top:0">Exclui sua conta, todos os lançamentos, metas e configurações. Não dá para desfazer.</p><button class="btn danger block" data-action="acct-delete">🗑️ Excluir conta e dados</button></div>`;
}
async function checkRevoked(){
  if(state.mode!=='firebase'||!state.user)return;
  const k='pf_loginAt_'+state.user.uid,la=store.get(k,0);
  if(!la){store.set(k,Date.now());return;}
  if(S().revokedAt&&S().revokedAt>la){toast('Sua sessão foi encerrada em outro aparelho.');await A.signOut(fb.auth);}
}
hooks.afterLoad.push(checkRevoked);
document.addEventListener('visibilitychange',async()=>{

});

Object.assign(actions,{
  's-open'(el){openSPage(el.dataset.p);},
  's-back'(){backSPage();},
  'set-theme'(el){setTheme(el.dataset.v);},
  'photo-del'(){S().profile.photo='';saveSettings();render();},
  'save-profile'(el){
    const g=id=>$('#'+id).value.trim(),err=$('#p-err'),inc=g('p-income')?parseMoney(g('p-income')):0,birth=g('p-birth');
    if(isNaN(inc)||inc<0){err.textContent='Renda mensal inválida.';return;}
    if(birth&&birth>todayStr()){err.textContent='A data de nascimento não pode ser no futuro.';return;}
    err.textContent='';
    Object.assign(S().profile,{name:g('p-name'),nickname:g('p-nick'),phone:g('p-phone'),birth,city:g('p-city'),income:inc||0,job:g('p-job')});
    el.disabled=true;saveSettings().then(()=>{el.disabled=false;render();});
  },
  'pw-change'(){openSheet(`<h3>Alterar senha</h3><div class="field"><label for="pw-cur">Senha atual</label><input id="pw-cur" class="input" type="password" autocomplete="current-password" autofocus></div><div class="field"><label for="pw-new">Nova senha</label><input id="pw-new" class="input" type="password" autocomplete="new-password"></div><div class="field"><label for="pw-cf">Repetir nova senha</label><input id="pw-cf" class="input" type="password" autocomplete="new-password"></div><p id="pw-err" class="err" role="alert"></p><button class="btn primary block" data-action="pw-save">Salvar nova senha</button>`);},
  async 'pw-save'(el){
    const cur=$('#pw-cur').value,nw=$('#pw-new').value,cf=$('#pw-cf').value,err=$('#pw-err');
    if(!cur){err.textContent='Informe a senha atual.';return;}
    if(nw.length<6){err.textContent='A nova senha precisa ter pelo menos 6 caracteres.';return;}
    if(nw!==cf){err.textContent='As senhas não coincidem.';return;}
    el.disabled=true;
    try{const u=await reauth(cur);await A.updatePassword(u,nw);closeSheet();toast('Senha alterada ✓');}
    catch(e){err.textContent=authErr(e);el.disabled=false;}
  },
  async 'pw-reset'(){
    try{await A.sendPasswordResetEmail(fb.auth,state.user.email);toast('E-mail de redefinição enviado ✓ Confira também o spam.');}
    catch(e){toast(authErr(e));}
  },
  async 'sign-out'(){if(await confirmSheet('Sair da conta','Você precisará entrar novamente neste aparelho.','Sair'))await A.signOut(fb.auth);},
  async 'sign-out-all'(){
    if(!await confirmSheet('Sair de todos os dispositivos','Todos os aparelhos conectados serão desconectados, inclusive este. Vale a partir da próxima vez que cada um abrir o app.','Sair de todos'))return;
    S().revokedAt=Date.now();
    const ok=await saveSettings(false);
    if(!ok)toast('Não consegui avisar os outros aparelhos (confira a regra do Firestore). Saindo só deste.');
    await A.signOut(fb.auth);
  },
  async 'acct-delete'(){
    if(!await confirmSheet('Excluir conta e dados?','Isso apaga sua conta, lançamentos, metas e configurações para sempre.','Continuar',true))return;

async function retag(old,nw){
  const groups={};
  state.tx.filter(t=>t.tags.includes(old)).forEach(t=>{const tags=[...new Set(t.tags.map(x=>x===old?nw:x).filter(Boolean))],k=JSON.stringify(tags);(groups[k]=groups[k]||{tags,ids:[]}).ids.push(t.id);});
  const ok=await safe(async()=>{for(const g of Object.values(groups))await DB.updMany(g.ids,{tags:g.tags});});
  if(ok){closeSheet();render();toast(nw?'Tag renomeada ✓':'Tag removida ✓');}
}

const ACC_T={checking:'Conta corrente',savings:'Poupança',wallet:'Carteira',invest:'Investimentos'};
const ACC_ICO={checking:'🏦',savings:'🐖',wallet:'👛',invest:'📈'};
const accBalance=a=>round2((Number(a.initial)||0)+state.tx.filter(t=>t.accountId===a.id&&t.status==='paid').reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0));
function cardInfo(c){
  const today=todayStr(),cl=clamp(Number(c.closing)||28,1,28),pend=state.tx.filter(t=>t.accountId===c.id&&t.type==='expense'&&t.status==='pending');
  let close=`${today.slice(0,7)}-${pad(cl)}`;if(today>close)close=addMonths(close,1);
  const start=addDays(addMonths(close,-1),1),used=pend.reduce((a,t)=>a+t.amount,0);
  const inv=pend.filter(t=>t.date>=start&&t.date<=close).reduce((a,t)=>a+t.amount,0),lim=Number(c.limit)||0;
  return {used,inv,avail:lim-used,pct:lim>0?used/lim*100:0};
}

fieldHandlers.push((e,t)=>{
  if(e.type!=='change'||t.dataset.budget===undefined)return;
  const c=t.dataset.budget,v=t.value.trim()?parseMoney(t.value):0;

hooks.afterSave.push(list=>{ // alerta de orçamento ao lançar despesas
  const m=monthOf(todayStr()),B=S().budgets,cats=[...new Set(list.filter(t=>t.type==='expense'&&monthOf(t.date)===m&&B[t.category]>0).map(t=>t.category))];
  cats.forEach(c=>{
    const spent=monthTx(m).filter(t=>t.type==='expense'&&t.category===c).reduce((a,t)=>a+t.amount,0);
    const added=list.filter(t=>t.type==='expense'&&t.category===c&&monthOf(t.date)===m).reduce((a,t)=>a+t.amount,0);
    const before=(spent-added)/B[c]*100,now=spent/B[c]*100;
    if(before<100&&now>=100)setTimeout(()=>toast(`🚨 ${c} passou do orçamento (${Math.round(now)}%).`),2200);
    else if(before<80&&now>=80)setTimeout(()=>toast(`⚠️ ${c} chegou a ${Math.round(now)}% do orçamento.`),2200);
  });
});

Object.assign(actions,{
  'cat-type'(el){catType=el.dataset.v;render();},
  'cat-new'(){openCatForm(null);},
  'cat-edit'(el){openCatForm(+el.dataset.i);},
  'cat-up'(el){ensureCats();const l=S().categories[catType],i=+el.dataset.i;if(i>0){[l[i-1],l[i]]=[l[i],l[i-1]];saveSettings(false);render();}},
  'cat-down'(el){ensureCats();const l=S().categories[catType],i=+el.dataset.i;if(i<l.length-1){[l[i+1],l[i]]=[l[i],l[i+1]];saveSettings(false);render();}},
  'cat-ico'(el){catDraft.icon=el.dataset.v;$('#cf-ico').value=el.dataset.v;$$('.emojis button').forEach(b=>b.classList.toggle('on',b===el));},
  'cat-col'(el){catDraft.color=el.dataset.v;$$('.swatch').forEach(b=>b.classList.toggle('on',b===el));},
  async 'cat-save'(){
    const name=$('#cf-name').value.trim(),err=$('#cf-err');
    if(!name){err.textContent='Dê um nome para a categoria.';return;}
    ensureCats();const list=S().categories[catType],i=catDraft.i;
    if(list.some((x,j)=>j!==i&&norm(x.name)===norm(name))){err.textContent='Já existe uma categoria com esse nome.';return;}
    const icon=$('#cf-ico').value.trim()||catDraft.icon,arch=!!$('#cf-arch')?.checked;
    if(i==null)list.push({name,icon,color:catDraft.color});
    else{
      const old=list[i].name;
      if(old!==name){
        const ids=state.tx.filter(t=>t.type===catType&&t.category===old).map(t=>t.id);
        if(ids.length){
          if(!await confirmSheet('Renomear categoria',`${ids.length} lançamento(s) serão atualizados para “${name}”.`,'Renomear'))return;
          if(!await safe(()=>DB.updMany(ids,{category:name})))return;
        }
        if(catType==='expense'&&S().budgets[old]!=null){S().budgets[name]=S().budgets[old];delete S().budgets[old];}
        const R=S().rules[catType]||{};Object.keys(R).forEach(k=>{if(R[k]===old)R[k]=name;});
      }
      list[i]={name,icon,color:catDraft.color,archived:arch||undefined};
    }
    closeSheet();await saveSettings();render();
  },
  'rule-add'(){
    const key=ruleKey($('#r-word').value),cat=$('#r-cat').value;
    if(!key||key.length<2){toast('Digite uma palavra para a regra.');return;}
    S().rules[catType]=S().rules[catType]||{};S().rules[catType][key]=cat;saveSettings();render();
  },
  'rule-del'(el){delete S().rules[catType][el.dataset.k];saveSettings(false);render();},
  'tag-edit'(el){const tg=el.dataset.t;openSheet(`<h3>#${esc(tg)}</h3><div class="field"><label for="tg-new">Novo nome</label><input id="tg-new" class="input" value="${esc(tg)}" autofocus></div><p id="tg-err" class="err" role="alert"></p><button class="btn primary block" data-action="tag-save" data-t="${esc(tg)}">Renomear</button><button class="btn danger block" style="margin-top:10px" data-action="tag-del" data-t="${esc(tg)}">Remover tag dos lançamentos</button>`);},
  async 'tag-save'(el){const nw=parseTags($('#tg-new').value)[0];if(!nw){$('#tg-err').textContent='Informe o novo nome.';return;}await retag(el.dataset.t,nw);},
  async 'tag-del'(el){await retag(el.dataset.t,null);},
  'acc-new'(){openAccForm();},
  'acc-edit'(el){openAccForm(el.dataset.id);},
  async 'acc-save'(el){
    const name=$('#ac-name').value.trim(),init=$('#ac-init').value.trim()?parseMoney($('#ac-init').value):0,err=$('#ac-err');
    if(!name){err.textContent='Dê um nome para a conta.';return;}
    if(isNaN(init)){err.textContent='Saldo inicial inválido.';return;}
    const o={name,type:$('#ac-type').value,initial:init},id=el.dataset.id;
    if(id)S().accounts=S().accounts.map(a=>a.id===id?{...a,...o}:a);else S().accounts.push({id:uid(),...o});
    closeSheet();await saveSettings();render();
  },
  async 'acc-del'(el){
    if(!await confirmSheet('Excluir conta','Os lançamentos continuam existindo, só perdem a ligação com esta conta.','Excluir',true))return;
    S().accounts=S().accounts.filter(a=>a.id!==el.dataset.id);await saveSettings();render();
  },
  'card-new'(){openCardForm();},
  'card-edit'(el){openCardForm(el.dataset.id);},
  async 'card-save'(el){
    const name=$('#cd-name').value.trim(),limit=parseMoney($('#cd-limit').value),err=$('#cd-err');
    if(!name){err.textContent='Dê um nome para o cartão.';return;}
    if(isNaN(limit)||limit<=0){err.textContent='Informe o limite do cartão.';return;}
    const o={name,limit,closing:+$('#cd-close').value,due:+$('#cd-due').value},id=el.dataset.id;
    if(id)S().cards=S().cards.map(c=>c.id===id?{...c,...o}:c);else S().cards.push({id:uid(),...o});
    closeSheet();await saveSettings();render();
  },
  async 'card-del'(el){
    if(!await confirmSheet('Excluir cartão','Os lançamentos continuam existindo, só perdem a ligação com este cartão.','Excluir',true))return;
    S().cards=S().cards.filter(c=>c.id!==el.dataset.id);await saveSettings();render();
  },
  'open-goals'(){state.view='goals';state.settingsPage=null;render();window.scrollTo(0,0);}
});

function checkReminders(){
  if(!state.user||state.loading)return;
  const n=S().notif,k=pk('rem'),mk=store.get(k,{}),today=todayStr(),now=new Date(),hm=`${pad(now.getHours())}:${pad(now.getMinutes())}`;let ch=false;
  if(n.bills&&mk.bills!==today){
    const lim=addDays(today,n.billsDays||3),l=state.tx.filter(t=>t.type==='expense'&&t.status==='pending'&&t.date<=lim);
    if(l.length)notify('Contas a vencer',`${l.length} conta(s) até ${fmtDate(lim)}: ${brl(l.reduce((a,t)=>a+t.amount,0))}`);
    mk.bills=today;ch=true;
  }
  if(n.daily&&mk.daily!==today&&hm>=(n.dailyTime||'20:00')){
    if(!state.tx.some(t=>t.date===today))notify('Hora de lançar','Você ainda não registrou nada hoje.');
    mk.daily=today;ch=true;
  }
  if(n.weekly&&mk.weekly!==today&&now.getDay()===(n.weeklyDay??1)){
    const from=addDays(today,-6),l=state.tx.filter(t=>t.date>=from&&t.date<=today),s=sums(l),top=Object.entries(catTotals(l,'expense')).sort((a,b)=>b[1]-a[1])[0];
    notify('Resumo da semana',`Receitas ${brl(s.income)} · Despesas ${brl(s.expense)}${top?` · Maior categoria: ${top[0]}`:''}`);
    mk.weekly=today;ch=true;
  }
  if(ch)store.set(k,mk);
}

function exportCSV(){

  for(const t of ['expense','income','investment'])S().rules[t]={...((s.rules&&s.rules[t])||{}),...(S().rules[t]||{})};
  ['accounts','cards'].forEach(k=>(s[k]||[]).forEach(x=>{if(x&&x.id&&!S()[k].some(y=>y.id===x.id))S()[k].push(x);}));

async function importBackup(file){
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());if(!Array.isArray(data.tx))throw new Error('formato');
    const key=t=>[t.date,t.type,Number(t.amount).toFixed(2),norm(t.description),t.category].join('|'),have=new Set(state.tx.map(key));
    const inc=data.tx.map(t=>normTx({...t,userId:state.user.uid})).filter(t=>/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&t.amount>0&&!have.has(key(t)));
    const goalsIn=(data.goals||[]).filter(g=>g&&g.name&&!state.goals.some(x=>norm(x.name)===norm(g.name)));
    if(!inc.length&&!goalsIn.length&&!data.settings){toast('Nada novo para importar. Tudo já estava aqui.');return;}
    const ok=await confirmSheet('Importar backup',`Vou adicionar ${inc.length} lançamento(s) e ${goalsIn.length} meta(s) novos${data.settings?', além de categorias, contas, cartões e regras que ainda não existem':''}. Itens iguais aos atuais são ignorados.`,'Importar');
    if(!ok)return;
    await safe(async()=>{
      await DB.addTx(inc.map(({id,...r})=>r));
      for(const g of goalsIn)await DB.addGoal({name:g.name,target:+g.target||0,current:+g.current||0,deadline:g.deadline||'',userId:state.user.uid});
      mergeSettingsFrom(data.settings);await saveSettings(false);render();toast('Backup importado ✓');
    });
  }catch(e){console.error(e);toast('Arquivo inválido. Use um backup gerado por este app.');}
}

const VT={run:0};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NW={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,catorze:14,quatorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,quatrocentas:400,quinhentos:500,quinhentas:500,seiscentos:600,seiscentas:600,setecentos:700,setecentas:700,oitocentos:800,oitocentas:800,novecentos:900,novecentas:900};
const MONTH_N=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WDAY_N=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
const V_EXPENSE=['gastei','paguei','comprei','parcelei','assinei','saiu'];
const V_INCOME=['recebi','ganhei','vendi','depositaram','entrou','rendeu','pagaram'];
const V_INVEST=['investi','apliquei','aportei','guardei'];
const V_ALL=[...V_EXPENSE,...V_INCOME,...V_INVEST,'transferi'];
const vnorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/r\$\s*/g,' reais ').replace(/[^a-z0-9,.\s]/g,' ').replace(/\.(?!\d)/g,' ').replace(/,(?!\d)/g,' | ').replace(/\s+/g,' ').trim();

// --- números por extenso → dígitos ("dois mil e quinhentos" → 2500, "dez e meio" → 10,5)
function numRun(tk,i){
  const isN=t=>t in NW;let j=i,total=0,cur=0,any=false,prev=false,onlyUm=true,count=0;
  while(j<tk.length){
    const t=tk[j];
    if(isN(t)){cur+=NW[t];any=true;prev=true;count++;if(t!=='um'&&t!=='uma')onlyUm=false;j++;}
    else if(t==='mil'){cur=(cur||1)*1000;total+=cur;cur=0;any=true;prev=true;onlyUm=false;j++;}
    else if(t==='e'&&prev&&j+1<tk.length&&(isN(tk[j+1])||tk[j+1]==='mil')){j++;prev=false;}
    else break;
  }
  if(!any)return null;
  let val=total+cur;
  if(tk[j]==='e'&&(tk[j+1]==='meio'||tk[j+1]==='meia')){val+=(val>=1000&&val%1000===0)?500:0.5;j+=2;}
  if(onlyUm&&count===1&&!['real','reais','conto','contos'].includes(tk[j]))return null; // "um tênis" não é número
  return {val,end:j};
}
function numberWords(t){
  const tk=t.split(' '),out=[];
  for(let i=0;i<tk.length;){const r=numRun(tk,i);if(r&&r.end>i){out.push(String(Math.round(r.val*100)/100).replace('.',','));i=r.end;}else{out.push(tk[i]);i++;}}
  return out.join(' ');
}
function expandMil(t){
  const pn=a=>/^\d{1,3}(\.\d{3})+$/.test(a)?parseFloat(a.replace(/\./g,'')):parseFloat(a.replace(',','.'));
  return t.replace(/(\d+(?:[.,]\d+)?)\s*mil\b(?:\s+e\s+(\d{1,3})\b)?/g,(m,a,b)=>String(Math.round(pn(a)*1000+(b?parseInt(b,10):0)))).replace(/\b(\d+(?:,\d+)?)\s*k\b/g,(m,a)=>String(Math.round(pn(a)*1000)));
}
function amountsIn(t){
  const re=/\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?/g,out=[];let m;

function splitSegments(t){

function voiceDate(t,past){

  if(/\banteontem\b/.test(t))return addDays(today,-2);
  if(/\bontem\b/.test(t))return addDays(today,-1);
  if(/\bamanha\b/.test(t))return addDays(today,1);
  if(/\bhoje\b/.test(t))return today;
  if(/semana passada/.test(t))return addDays(today,-7);
  const m=t.match(new RegExp(`\\bdia (\\d{1,2})(?: de (${mre}))?`))||t.match(new RegExp(`\\b(\\d{1,2}) de (${mre})`));
  if(m){
    const day=+m[1],mi=m[2]?MONTH_N.indexOf(m[2]):null;
    const mk=(y,mo)=>{const d=new Date(y,mo,1);d.setDate(Math.min(day,daysIn(d.getFullYear(),d.getMonth()+1)));return ymd(d);};
    let y=now.getFullYear(),mo=mi!=null?mi:now.getMonth();

    let s=mk(y,mo);

    return s;
  }

function matchAccount(t){
  const all=[...S().cards.map(c=>({...c,kind:'card'})),...S().accounts.map(a=>({...a,kind:'acc'}))],pad_=' '+t+' ';
  let best=null,bl=0;
  all.forEach(a=>{
    const n=norm(a.name),toks=n.split(' ').filter(x=>x.length>=3);
    const hit=pad_.includes(' '+n+' ')?n.length:Math.max(0,...toks.filter(x=>pad_.includes(' '+x+' ')).map(x=>x.length));
    if(hit>bl){bl=hit;best=a;}
  });

  return best;

const ACCENTS={farmacia:'farmácia',salario:'salário',cafe:'café',agua:'água',gas:'gás',pedagio:'pedágio',combustivel:'combustível',condominio:'condomínio',medico:'médico',tenis:'tênis',acougue:'açougue',almoco:'almoço',remedio:'remédio',ingles:'inglês',onibus:'ônibus',metro:'metrô',mae:'mãe',joao:'João',comissao:'comissão',decimo:'décimo',acai:'açaí',feijao:'feijão',pao:'pão',sacolao:'sacolão',cartao:'cartão',saude:'saúde',educacao:'educação',alimentacao:'alimentação'};

  for(const t of state.tx){const hit=t.description.split(/\s+/).find(x=>norm(x)===w);if(hit)return hit.toLowerCase();}

const V_STOP=new Set(['de','do','da','dos','das','no','na','nos','nas','em','com','para','pro','pra','um','uma','o','a','os','as','meu','minha','por','que','foi','deu','e','ao','pelo','pela','la','aqui','mais']);
const V_DROP=new Set([...V_ALL,'reais','real','conto','contos','pila','pilas','centavo','centavos','hoje','ontem','anteontem','amanha','dia','dias','semana','passada','passado','mes','este','esta','esse','essa','neste','nesta','pix','debito','credito','cartao','dinheiro','especie','boleto','transferencia','ted','doc','vezes','vez','parcelas','prestacoes','x','ultimo','proximo',...MONTH_N,...WDAY_N]);

function parseSegment(t,ctx){
  const verb=V_ALL.find(v=>new RegExp('\\b'+v+'\\b').test(t));
  let type=ctx.type||'expense';
  if(verb)type=V_INCOME.includes(verb)?'income':V_INVEST.includes(verb)?'investment':'expense';
  else if(/\b(investimento|aporte)\b/.test(t))type='investment';
  else if(/\b(receita|rendimento|dividendos?)\b/.test(t))type='income';
  const pastVerb=verb?true:!!ctx.pastVerb,mre=MONTH_N.join('|');
  const cands=amountsIn(t).map(c=>{
    const after=t.slice(c.end),before=t.slice(0,c.i);
    c.inst=/^\s*(?:x|vezes|vez|parcelas|prestacoes)\b/.test(after);
    c.date=/\b(?:dia|dias)\s*$/.test(before)||new RegExp(`^\\s*de\\s+(?:${mre})\\b`).test(after);
    c.misc=/^\s*(?:dias|horas|meses|anos|km|kg)\b/.test(after);
    c.cents=/^\s*centavos?\b/.test(after);
    c.cur=/\b(?:reais|real)\s*$/.test(before)||/^\s*(?:reais|real|conto|contos|pila|pilas)\b/.test(after);
    return c;
  });
  const pool=cands.filter(c=>!c.inst&&!c.date&&!c.misc&&!c.cents),cents=cands.find(c=>c.cents),instC=cands.find(c=>c.inst);
  let pick=pool.find(c=>c.cur)||[...pool].sort((a,b)=>b.v-a.v)[0],amount;
  if(pick)amount=round2(pick.v+(cents?cents.v/100:0));else if(cents)amount=round2(cents.v/100);else return null;
  if(!(amount>0))return null;
  const installments=instC?clamp(Math.round(instC.v),2,48):0;
  const dt=voiceDate(t,pastVerb);
  let payment='';
  if(/\bpix\b/.test(t))payment='Pix';else if(/\bdebito\b/.test(t))payment='Débito';else if(/\b(credito|cartao)\b/.test(t))payment='Crédito';
  else if(/\b(dinheiro|especie)\b/.test(t))payment='Dinheiro';else if(/\bboleto\b/.test(t))payment='Boleto';else if(/\b(transferencia|ted|doc)\b/.test(t))payment='Transferência';
  const acc=matchAccount(t);if(acc&&acc.kind==='card'&&!payment)payment='Crédito';
  const accTok=acc?norm(acc.name).split(' '):[];
  let words=t.split(' ').filter(w=>w&&!/^\d/.test(w)&&!V_DROP.has(w)&&!accTok.includes(w));
  while(words.length&&V_STOP.has(words[0]))words.shift();
  while(words.length&&V_STOP.has(words[words.length-1]))words.pop();
  let desc=words.map(accentWord).join(' ');desc=desc.charAt(0).toUpperCase()+desc.slice(1);
  let category=null;
  for(const c of activeCats(type)){const n=norm(c);if(n!=='outros'&&(' '+t+' ').includes(' '+n+' '))category=c;}
  if(!category)category=suggestCategory(desc,type)||suggestCategory(t.replace(/\bcartao\b/g,' '),type);
  if(!category||!activeCats(type).includes(category))category=activeCats(type).includes('Outros')?'Outros':activeCats(type)[0];
  return {type,amount,description:desc||(category!=='Outros'?category:'Lançamento por voz'),category,sug:category,date:dt||ctx.date||todayStr(),dateExplicit:!!dt,payment,accountId:acc?acc.id:'',installments,pastVerb};

function parseVoice(text){

function isQuery(text){

  return /^(quanto|quantos|qual|quais|me diga|me diz|me mostra|mostra|mostre|saldo|total|onde|como)\b/.test(q)||/\bsaldo\b/.test(q);

function answerQuery(text){
  const t=vnorm(text),today=todayStr(),curM=monthOf(today),plain=h=>h.replace(/<[^>]+>/g,'');
  if(/\b(onde|como)\b.*\b(economizar|poupar|melhorar|cortar)\b/.test(t)){const h='Essa análise fica para o assistente do bloco C. Por enquanto, veja os insights na tela inicial.';return {html:h,speech:h};}

  if(/\bhoje\b/.test(t)){from=to=today;label='hoje';}
  else if(/\bontem\b/.test(t)){from=to=addDays(today,-1);label='ontem';}
  else if(/semana passada/.test(t)){from=addDays(today,-13);to=addDays(today,-7);label='na semana passada';}
  else if(/\bsemana\b/.test(t)){from=addDays(today,-6);to=today;label='nos últimos 7 dias';}
  else if(/mes passado/.test(t)){const m=prevMonth(curM),R=fmRange(m);from=R.start;to=R.end;label='em '+monthLabel(m);}
  else if(mi>=0){const m=`${today.slice(0,4)}-${pad(mi+1)}`,R=fmRange(m);from=R.start;to=R.end;label='em '+monthLabel(m);}
  else if(/\bano\b/.test(t)){from=today.slice(0,4)+'-01-01';to=today.slice(0,4)+'-12-31';label='neste ano';}
  else{const R=fmRange(curM);from=R.start;to=R.end;label='em '+monthLabel(curM);}
  const inR=state.tx.filter(x=>x.date>=from&&x.date<=to);
  const done=h=>({html:h,speech:plain(h)});
  if(/\bsaldo\b/.test(t)){const s=sums(inR),bal=s.income-s.expense-s.investment;return done(`Seu saldo ${label} é <b>${brl(bal)}</b>: receitas ${brl(s.income)}, despesas ${brl(s.expense)}${s.investment?`, investido ${brl(s.investment)}`:''}.`);}
  let type='expense';
  if(/\b(recebi|receita|receitas|ganhei|renda)\b/.test(t))type='income';else if(/\b(investi|investimento|investimentos|apliquei)\b/.test(t))type='investment';
  const verb=type==='expense'?'gastou':type==='income'?'recebeu':'investiu';
  if(/\bmaior\b/.test(t)){const big=inR.filter(x=>x.type===type).sort((a,b)=>b.amount-a.amount)[0];return done(big?`O maior lançamento ${label} foi <b>${esc(big.description)}</b>: ${brl(big.amount)} (${fmtDate(big.date)}).`:`Não encontrei lançamentos ${label}.`);}
  let list=inR.filter(x=>x.type===type),catName=null,sub=null;
  for(const c of catDefs(type).map(c=>c.name)){const n=norm(c);if(n!=='outros'&&(' '+t+' ').includes(' '+n+' '))catName=c;}
  if(!catName){
    const m=t.match(/\b(?:com|em|no|na|de|do|da)\s+([a-z0-9 ]+?)(?=\s+(?:este|esse|neste|nesse|hoje|ontem|semana|mes|ano|em|no|na)\b|$)/),after=m&&m[1];

  if(!catName&&!sub&&type==='expense'&&list.length>1){
    const ents=Object.entries(catTotals(list,'expense')).sort((a,b)=>b[1]-a[1]).slice(0,5);

  }

function listen({lang,onState,onInterim,onFinal,onError,maxMs=20000,noSpeechMs=8000,idleMs=2200}){

async function loadImage(file){ // respeita a orientação EXIF da câmera
  if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:'from-image'});}catch{}}
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);res(im);};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'));};im.src=url;});
}
async function compress(file,maxSide,q){
  const im=await loadImage(file),w0=im.width||im.naturalWidth,h0=im.height||im.naturalHeight;
  if(!w0||!h0)throw new Error('decode');
  const k=Math.min(1,maxSide/Math.max(w0,h0)),w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  if(im.close)im.close();
  return {canvas:c,dataUrl:c.toDataURL('image/jpeg',q),w,h};
}
function downscale(canvas,maxSide,q){
  const k=Math.min(1,maxSide/Math.max(canvas.width,canvas.height)),w=Math.round(canvas.width*k),h=Math.round(canvas.height*k),c=document.createElement('canvas');
  c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(canvas,0,0,w,h);return c.toDataURL('image/jpeg',q);
}
function enhance(canvas){ // tons de cinza + contraste: ajuda o OCR
  const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;const x=c.getContext('2d');x.drawImage(canvas,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){const g=clamp((.299*p[i]+.587*p[i+1]+.114*p[i+2]-128)*1.35+136,0,255);p[i]=p[i+1]=p[i+2]=g;}
  x.putImageData(d,0,0);return c;
}

function ensureTesseract(){

async function ocr(canvas,onProgress){

  // valor: prioriza linhas com “total / valor a pagar / valor pago”

  lines.forEach((ln,li)=>{const re=/(\d{1,3}(?:\.\d{3})+|\d+)[,.](\d{2})(?!\d)/g,nl=norm(ln);let m;while((m=re.exec(ln))){const v=parseFloat(m[1].replace(/\./g,'')+'.'+m[2]);if(v>0&&v<1e7)vals.push({v,li,nl});}});
  const KEYS=['valor total','total a pagar','valor a pagar','total geral','valor pago','valor da transacao','valor do pagamento','total','valor','pago'],BAD=/subtotal|troco|desconto|tribut|imposto|recebido|entregue|icms|pis|cofins/;
  let amount=null;
  for(const key of KEYS){
    const idx=lines.map((l,i)=>norm(l).includes(key)&&!BAD.test(norm(l))?i:-1).filter(i=>i>=0);
    const c=vals.filter(x=>idx.includes(x.li)||idx.includes(x.li-1));
    if(c.length){amount=Math.max(...c.map(x=>x.v));break;}
  }
  if(amount==null){const f=vals.filter(x=>!BAD.test(x.nl));if(f.length)amount=Math.max(...f.map(x=>x.v));}
  // data
  const MAB={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12},dates=[];
  lines.forEach((ln,li)=>{
    let m;const re=/\b(\d{2})[\/\-.](\d{2})[\/\-.](\d{4}|\d{2})\b/g;
    while((m=re.exec(ln))){let y=+m[3];if(y<100)y+=2000;dates.push({s:`${y}-${m[2]}-${m[1]}`,li});}
    const re2=/\b(\d{1,2}) (?:de )?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]* (?:de )?(\d{4})\b/g,nl=norm(ln);
    while((m=re2.exec(nl)))dates.push({s:`${m[3]}-${pad(MAB[m[2]])}-${pad(+m[1])}`,li});
  });
  const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&+s.slice(5,7)>=1&&+s.slice(5,7)<=12&&+s.slice(8)>=1&&+s.slice(8)<=31&&s<=addDays(today,1)&&s>=addYears(today,-3);
  const valid=dates.filter(d=>okDate(d.s)).sort((a,b)=>(/data|emissao|pagamento|realizad|efetivad/.test(norm(lines[b.li]))?1:0)-(/data|emissao|pagamento|realizad|efetivad/.test(norm(lines[a.li]))?1:0));
  const date=valid.length?valid[0].s:null;
  // estabelecimento: favorecido do Pix ou primeira linha “de nome” do cupom
  let merchant='';
  const pi=lines.findIndex(l=>/^(para|destino|favorecido|recebedor|beneficiario|nome do recebedor|quem recebeu)\b/.test(norm(l)));
  if(pi>=0){const after=lines[pi].split(/[:\-]/).slice(1).join(' ').trim();merchant=after.length>2?after:(lines[pi+1]||'');}
  if(!merchant){
    const skip=/cnpj|cpf|cupom|nota|danfe|documento|inscri|rua |avenida|^av\b|tel|fone|www|http|consumidor|data|hora|total|valor|comprovante|^\d/;
    merchant=lines.slice(0,8).find(l=>{const letters=(l.match(/[A-Za-zÀ-ÿ]/g)||[]).length;return letters>=4&&letters/l.length>.6&&!skip.test(norm(l));})||'';
  }
  merchant=merchant.replace(/[^A-Za-zÀ-ÿ0-9 &'.\-]/g,' ').replace(/\s+/g,' ').trim().slice(0,50).toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
  let payment='';
  if(/\bpix\b/.test(t))payment='Pix';else if(/cartao de credito|credito|visa|master/.test(t))payment='Crédito';else if(/debito/.test(t))payment='Débito';
  else if(/\bdinheiro\b/.test(t))payment='Dinheiro';else if(/boleto/.test(t))payment='Boleto';else if(/transferencia|\bted\b/.test(t))payment='Transferência';
  const type=/voce recebeu|pix recebido|recebido de|transferencia recebida|credito em conta/.test(t)?'income':'expense';
  let category=suggestCategory(merchant,type);
  if(!category)for(const [c,ws] of Object.entries(RCP_KW))if(ws.some(w=>t.includes(w))){category=c;break;}
  if(category&&!activeCats(type).includes(category))category=null;
  return {amount,date,merchant,payment,type,category,src:'ocr'};
}

async function readReceipt(big,onStep){
  let result=null,text='';
  if(aiAvailable()){
    onStep('Lendo o comprovante com IA…');
    try{result=await aiRead(big.canvas.toDataURL('image/jpeg',.8));}catch(e){console.warn('IA indisponível',e);}

    if(!navigator.onLine)throw Object.assign(new Error('offline'),{code:'unavailable'});
    await ensureTesseract();if(!alive())return;
    const o=await ocr(enhance(fakeReceipt()),p=>{if(alive())set('ocr','run','Lendo o comprovante de exemplo… '+Math.round(p*100)+'%');});
    if(!alive())return;text=o.text;
    const good=/TOTAL/i.test(text)||/45[,.]90/.test(text);
    set('ocr',good?'ok':'bad',`Texto lido (${text.replace(/\s/g,'').length} caracteres, confiança ${Math.round(o.conf)}%): “${text.replace(/\s+/g,' ').trim().slice(0,70)}…”`,good?'':'O leitor abriu mas não reconheceu o exemplo. Tente de novo em outra rede.');
  }catch(e){
    console.warn(e);if(!alive())return;
    set('ocr','bad',!navigator.onLine?'Sem internet para carregar o leitor.':'Não consegui carregar o leitor OCR (rede lenta ou bloqueada).','Conecte-se à internet e repita (só é necessário na primeira vez). Sem o leitor, você ainda pode lançar com a foto anexada, preenchendo os campos à mão.');
  }
  // 6 interpretação
  const usingFake=!text||!/TOTAL/i.test(text),p=parseReceipt(usingFake?FAKE_TEXT():text),prob=[];
  if(!p.amount||Math.abs(p.amount-45.9)>.01)prob.push('valor');
  if(p.date!==todayStr())prob.push('data');
  if(!/mercado/i.test(p.merchant))prob.push('estabelecimento');
  if(p.payment!=='Pix')prob.push('forma de pagamento');
  if(!alive())return;
  set('parse',prob.length?'bad':'ok',`${usingFake?'(texto de exemplo) ':''}Valor ${p.amount!=null?nf.format(p.amount):'—'}, data ${p.date?fmtDate(p.date):'—'}, ${p.merchant||'sem estabelecimento'}, ${p.payment||'sem forma de pagamento'}${p.category?`, categoria sugerida: ${p.category}`:''}.`,prob.length?'Não identifiquei: '+prob.join(', ')+'.':'');
  // 7 armazenamento
  set('store','run');const id='teste-'+Date.now(),tiny='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAAAP/EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AKp//2Q==';
  try{
    await RC.save(id,tiny);const back=await RC.get(id);await RC.del(id);if(!alive())return;
    set('store',back===tiny?'ok':'bad',back===tiny?(state.mode==='firebase'?'Gravou, leu e apagou um comprovante de teste na coleção receipts.':'Armazenamento local funcionando.'):'Gravou, mas a leitura voltou diferente.');
  }catch(e){
    console.error(e);if(!alive())return;
    set('store',isNet(e)?'info':'bad',e.code==='permission-denied'?'O Firestore recusou gravar em receipts.':isNet(e)?'Sem conexão para testar o armazenamento.':'Não consegui gravar o comprovante de teste.',e.code==='permission-denied'?'Publique a regra “receipts” (Ajustes › Sobre e ajuda).':'');
  }
  finish();
}

function authHtml(mode){

   <p class="muted small center" style="margin:16px 0 0">🔒 Seus dados ficam na sua conta e só você os vê.</p>
  </div>`;
}
const authMsg=(t,info)=>{const m=$('#au-msg');if(m){m.textContent=t;m.className='msg'+(info?' info':'');}};
const loginErr=e=>{const c=e&&e.code;return ['auth/wrong-password','auth/user-not-found','auth/invalid-credential','auth/invalid-email'].includes(c)?'E-mail ou senha incorretos.':c==='auth/network-request-failed'?'Sem conexão. Verifique sua internet.':c==='auth/too-many-requests'?'Muitas tentativas. Aguarde alguns minutos.':c==='auth/user-disabled'?'Esta conta foi desativada.':'Não foi possível entrar. Tente novamente.';};
const signupErr=e=>{const c=e&&e.code;return c==='auth/email-already-in-use'?'Este e-mail já tem conta. Entre ou use “Esqueci minha senha”.':c==='auth/invalid-email'?'E-mail inválido.':c==='auth/weak-password'?'A senha precisa ter pelo menos 6 caracteres.':c==='auth/operation-not-allowed'?'O cadastro por e-mail está desativado no Firebase (Authentication › Método de login › E-mail/senha).':c==='auth/network-request-failed'?'Sem conexão. Verifique sua internet.':'Não foi possível criar a conta. Tente novamente.';};
async function authSubmit(){
  const email=$('#au-email').value.trim(),pass=$('#au-pass').value,su=authMode==='signup';
  if(!email||!pass){authMsg('Preencha e-mail e senha.');return;}
  if(!A){authMsg('Não consegui conectar ao Firebase. Confira a internet e tente de novo.');return;}
  if(su){
    const name=$('#au-name').value.trim();
    if(pass.length<6){authMsg('A senha precisa ter pelo menos 6 caracteres.');return;}
    if(pass!==$('#au-pass2').value){authMsg('As senhas não coincidem.');return;}
    authMsg('Criando sua conta…',true);
    try{
      const cred=await A.createUserWithEmailAndPassword(fb.auth,email,pass);
      store.set('pf_loginAt_'+cred.user.uid,Date.now());
      try{await A.updateProfile(cred.user,{displayName:name});}catch{}
      try{await A.sendEmailVerification(cred.user);}catch{}
      for(let i=0;i<60&&(state.loading||!state.user);i++)await new Promise(r=>setTimeout(r,100));
      if(name){S().profile.nickname=name;if(!S().profile.name)S().profile.name=name;saveSettings(false);render();}
      toast('Conta criada! Enviamos um e-mail para confirmar seu endereço.');
    }catch(err){console.error(err);authMsg(signupErr(err));}
  }else{
    authMsg('Entrando…',true);
    try{const cred=await A.signInWithEmailAndPassword(fb.auth,email,pass);store.set('pf_loginAt_'+cred.user.uid,Date.now());authMsg('');}
    catch(err){authMsg(loginErr(err));}
  }
}
async function authReset(){
  const email=(($('#au-email')||{}).value||'').trim();
  if(!email){authMsg('Digite seu e-mail acima e toque em “Esqueci minha senha”.');return;}
  if(!A){authMsg('Não consegui conectar ao Firebase.');return;}
  try{await A.sendPasswordResetEmail(fb.auth,email);authMsg('Pronto! Se existir uma conta com esse e-mail, enviamos o link para criar uma nova senha. Confira o spam.',true);}
  catch(err){authMsg(err.code==='auth/invalid-email'?'E-mail inválido.':err.code==='auth/network-request-failed'?'Sem conexão.':'Não foi possível enviar agora. Tente de novo.');}
}
(()=>{

(()=>{

  const reset=()=>{sh.classList.remove('drag');sh.style.transform='';bk.style.background='';};
  const begin=(y,grab)=>{if(isOpen())st={y0:y,dy:0,t0:performance.now(),grab,go:false};};
  const move=(y,e)=>{
    if(!st)return;const dy=y-st.y0;
    if(!st.go){if(dy>8&&(st.grab||sh.scrollTop<=0)){st.go=true;sh.classList.add('drag');}else{if(dy<-8)st=null;return;}}

  const end=()=>{
    if(!st)return;const {dy,t0,go}=st;st=null;if(!go)return;
    const v=dy/Math.max(1,performance.now()-t0);
    if(dy>120||v>.7){sh.classList.remove('drag');sh.style.transform='translateY(100%)';setTimeout(()=>{closeSheet(false);reset();},200);}
    else reset();
  };
  sh.addEventListener('touchstart',e=>{if(e.target.closest('canvas,input[type=range]'))return;begin(e.touches[0].clientY,!!e.target.closest('.grab'));},{passive:true});
  sh.addEventListener('touchmove',e=>move(e.touches[0].clientY,e),{passive:false});
  sh.addEventListener('touchend',end);

  sh.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.target.closest('.grab')){begin(e.clientY,true);try{sh.setPointerCapture(e.pointerId);}catch{}}});
  sh.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&st)move(e.clientY,e);});

const _parseSegmentB=parseSegment;
parseSegment=function(t,ctx){
  let status=null,freq=null,count=0,hint=null;
  if(/\b(vence|vencimento|vencendo|a pagar|vou pagar|pagar dia|ainda nao paguei|nao paguei|pendente|agendad[oa]|em aberto|a receber|vou receber|receber dia)\b/.test(t))status='pending';
  else if(/\b(ja paguei|ja recebi|pago|quitad[oa])\b/.test(t))status='paid';
  const rm=t.match(/\b(todo mes|todos os meses|mensal|mensalmente|toda semana|todas as semanas|semanal|semanalmente|todo ano|todos os anos|anual|anualmente)\b/);
  if(rm){freq=/semana|semanal/.test(rm[1])?'weekly':/ano|anual/.test(rm[1])?'yearly':'monthly';const cm=t.match(/\b(?:por|durante|ate)\s+(\d{1,2})\s+(?:meses|semanas|anos)\b/);count=cm?clamp(+cm[1],2,60):(freq==='yearly'?3:12);}
  const hm=t.match(/\bcategoria\s+([a-z0-9 ]+?)(?=\s+(?:no|na|em|de|do|da|hoje|ontem|paguei|gastei|recebi)\b|$)/);
  if(hm){hint=hm[1].trim();t=t.replace(hm[0],' ');}
  const it=_parseSegmentB(t,ctx);if(!it)return it;
  if(status)it.status=status;
  if(freq&&!(it.installments>1))it.recurrence={freq,count};
  if(hint){const n=norm(hint),c=activeCats(it.type).find(x=>norm(x)===n)||activeCats(it.type).find(x=>norm(x).startsWith(n)||n.startsWith(norm(x)));if(c){it.category=c;it.sug=c;}}
  if(status==='pending'&&it.dateExplicit&&it.date<todayStr()&&/\bdia \d/.test(t))it.date=addMonths(it.date,1);
  if(!it.payment){
    if(/\b(em maos|na mao)\b/.test(t))it.payment='Dinheiro';
    else if(/\b(cheque|vale|ticket|voucher|cripto|bitcoin|picpay|mercado pago|apple pay|google pay|carteira digital)\b/.test(t))it.payment='Outro';
  }
  if(!it.accountId){
    const typ=/\bpoupanca\b/.test(t)?'savings':/\bcarteira\b/.test(t)?'wallet':/\bconta corrente\b/.test(t)?'checking':null;
    if(typ){const l=S().accounts.filter(a=>a.type===typ);if(l.length===1)it.accountId=l[0].id;}
  }

};

const MAB2={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const okd=r=>/^\d{4}-\d{2}-\d{2}$/.test(r)&&+r.slice(5,7)>=1&&+r.slice(5,7)<=12&&+r.slice(8)>=1&&+r.slice(8)<=31&&r>=addDays(todayStr(),-400)&&r<=addDays(todayStr(),500);
function dateFrom(s){
  s=String(s||'');let m=s.match(/\b(\d{2})[\/\-.](\d{2})[\/\-.](\d{4}|\d{2})\b/);
  if(m){let y=+m[3];if(y<100)y+=2000;const r=`${y}-${m[2]}-${m[1]}`;if(okd(r))return r;}
  m=norm(s).match(/\b(\d{1,2}) ?(?:de )?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]* ?(?:de )?(\d{2,4})\b/);
  if(m){let y=+m[3];if(y<100)y+=2000;const r=`${y}-${pad(MAB2[m[2]])}-${pad(+m[1])}`;if(okd(r))return r;}
  return null;
}
const moneyIn=l=>[...String(l||'').matchAll(/(\d{1,3}(?:\.\d{3})+|\d+),(\d{2})(?!\d)/g)].map(m=>parseFloat(m[1].replace(/\./g,'')+'.'+m[2]));
const SERVICES=[
 ['luz','Luz',/\b(cemig|enel|cpfl|light|energisa|equatorial|neoenergia|celpe|coelba|cosern|elektro|copel|celesc|rge|eletropaulo|ceee|energia eletrica|kwh)\b/],

];
const PROVIDERS=['Cemig','Enel','CPFL','Light','Energisa','Equatorial','Neoenergia','Celpe','Coelba','Cosern','Elektro','Copel','Celesc','RGE','Sabesp','Copasa','Sanepar','Embasa','Cedae','Caesb','Compesa','Cagece','Comgás','Naturgy','Ultragaz','Vivo','Claro','TIM','Oi','Brisanet','Algar','Sercomtel','Desktop'];
function boletoInfo(d){ // valor e vencimento embutidos na linha digitável
  if(d.length===47){
    const fator=+d.slice(33,37),val=parseInt(d.slice(37,47),10)/100;let date=null;
    if(fator){const t=todayStr(),a=fator>=1000?addDays('2025-02-22',fator-1000):null,b=addDays('1997-10-07',fator),ok=s=>s&&s>=addDays(t,-400)&&s<=addDays(t,500);date=ok(a)?a:ok(b)?b:null;}
    return {amount:val>0?val:null,date};
  }
  if(d.length===48&&d[0]==='8'){
    const b44=d.slice(0,11)+d.slice(12,23)+d.slice(24,35)+d.slice(36,47),amount=(b44[2]==='6'||b44[2]==='7')?parseInt(b44.slice(4,15),10)/100:null;
    return {amount:amount>0?amount:null,date:null};
  }
  return null;
}
function enrichDoc(text,b){
  const raw=String(text||''),n=norm(raw),lines=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const svc=SERVICES.find(s=>s[2].test(n));
  const bill=/(vencimento|linha digitavel|codigo de barras|segunda via|kwh|leitura atual|debito automatico)/.test(n)||(!!svc&&/valor a pagar|total a pagar|fatura/.test(n));
  const out={...b,kind:bill?'bill':'receipt',tags:[],note:'',status:''},notes=[];
  const cnpj=(raw.match(/\b\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}\b/)||[])[0];
  if(cnpj)notes.push('CNPJ '+cnpj);
  if(!bill){
    if(/nfc ?e|nf e|danfe|nota fiscal|cupom fiscal/.test(n))out.tags.push('nota-fiscal');
    out.note=notes.join(' · ');return out;
  }
  // conta de consumo / boleto: valor a pagar, VENCIMENTO, linha digitável
  out.type='expense';out.status='pending';
  let amount=null;
  for(const k of ['valor a pagar','total a pagar','valor do documento','valor total da fatura','total da fatura','valor cobrado','valor a ser pago','total do documento','valor da fatura']){
    const i=lines.findIndex(l=>norm(l).includes(k));
    if(i>=0){const a=moneyIn(lines[i]).concat(moneyIn(lines[i+1]||''));if(a.length){amount=a[0];break;}}
  }
  let due=null;
  for(let i=0;i<lines.length&&!due;i++)if(/vencimento|vence |pagar ate|data limite/.test(norm(lines[i])))due=dateFrom(lines[i])||dateFrom(lines[i+1]||'');
  const bar=lines.map(l=>l.replace(/\D/g,'')).find(d=>d.length===47||d.length===48),bol=bar?boletoInfo(bar):null;
  if(amount==null&&bol&&bol.amount)amount=bol.amount;
  if(!due&&bol&&bol.date)due=bol.date;
  if(amount!=null)out.amount=amount;
  if(due)out.date=due;
  const prov=PROVIDERS.find(p=>new RegExp('\\b'+norm(p)+'\\b').test(n))||'';
  const label=svc?svc[1].toLowerCase():'';
  out.merchant=(label?`Conta de ${label}`:'Conta')+((prov||(!label&&b.merchant))?' — '+(prov||b.merchant):'');
  out.payment=bar||/boleto|codigo de barras|linha digitavel/.test(n)?'Boleto':/debito automatico/.test(n)?'Débito':/\bpix\b/.test(n)?'Pix':'';
  const pref=activeCats('expense').find(c=>/^(contas?( fixas?)?|utilidades|servicos)$/.test(norm(c)));
  out.category=pref||(activeCats('expense').includes('Moradia')?'Moradia':b.category);
  if(svc)out.tags.push(svc[0]);
  const ref=n.match(/\b(?:referencia|competencia|mes ref)\D{0,12}(\d{2} ?\d{4}|[a-z]{3} ?\d{2,4})\b/);
  if(ref)notes.push('Referência '+ref[1]);
  if(bar)notes.push('Linha digitável: '+bar.replace(/(\d{5})(\d{5})(\d{5})(\d{6})(\d{5})(\d{6})(\d)(\d{14})/,'$1.$2 $3.$4 $5.$6 $7 $8'));
  out.note=notes.join('\n');
  return out;
}
